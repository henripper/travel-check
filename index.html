<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rhodes Day Planner</title>
  <meta name="description" content="Plan your day on Rhodes: sights by category, distance from where you stay, walk or ride, cost and rating.">
  <meta name="theme-color" content="#0b5ea8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rhodes Day">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>Rhodes Day Planner</h1>
      <button id="baseBtn" class="base-chip" type="button">📍 <span id="baseName">Set your stay</span></button>
    </div>
  </header>

  <main>
    <!-- Explore -->
    <section id="view-explore" class="view active">
      <div class="controls">
        <div class="seg" id="rangeSeg" role="group" aria-label="Range">
          <button data-range="2">🚶 ≤2 km</button>
          <button data-range="5">≤5 km</button>
          <button data-range="15">≤15 km</button>
          <button data-range="999">Island</button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="mustSee">
          <span>Also show must-sees beyond range (★4.6+)</span>
        </label>
        <div class="chips" id="catChips"></div>
        <div class="row">
          <select id="sortSel" aria-label="Sort">
            <option value="dist">Sort: nearest</option>
            <option value="rating">Sort: top rated</option>
            <option value="value">Sort: best nearby (rating ÷ distance)</option>
          </select>
          <select id="costSel" aria-label="Cost">
            <option value="any">Any cost</option>
            <option value="free">Free only</option>
            <option value="cheap">Free or under €8</option>
          </select>
        </div>
      </div>
      <p class="count" id="exploreCount"></p>
      <div id="exploreList" class="list"></div>
    </section>

    <!-- Map -->
    <section id="view-map" class="view">
      <div id="map"></div>
    </section>

    <!-- Today -->
    <section id="view-today" class="view">
      <div class="today-head">
        <h2>Today's plan</h2>
        <p class="muted">Ordered as a loop from your stay, nearest stop first.</p>
        <div class="row">
          <button id="suggestWalk" class="btn primary" type="button">✨ Suggest a walking day</button>
          <button id="suggestFar" class="btn" type="button">🚗 Suggest a day trip</button>
        </div>
      </div>
      <div id="todaySummary"></div>
      <div id="todayList" class="list"></div>
    </section>

    <!-- My list -->
    <section id="view-mine" class="view">
      <div class="controls">
        <div class="seg" id="mineSeg" role="group" aria-label="Status">
          <button data-status="done" class="on">✓ Done</button>
          <button data-status="ignored">✕ Ignored</button>
        </div>
      </div>
      <p class="count" id="mineCount"></p>
      <div id="mineList" class="list"></div>
      <div class="danger-zone">
        <button id="resetBtn" class="btn ghost" type="button">Reset all marks</button>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="explore" class="on"><span>🧭</span>Explore</button>
    <button data-view="map"><span>🗺️</span>Map</button>
    <button data-view="today"><span>📅</span>Today<b id="todayBadge" class="badge" hidden></b></button>
    <button data-view="mine"><span>✅</span>My list</button>
  </nav>

  <!-- Where are you staying? -->
  <dialog id="baseDialog">
    <form method="dialog" class="dlg">
      <h2>Where are you staying?</h2>
      <p class="muted">Distances are measured from here. Saved on this phone only.</p>
      <button id="gpsBtn" class="btn primary wide" type="button">📍 Use my current location</button>
      <p id="gpsMsg" class="muted small"></p>
      <div class="or">or pick an area</div>
      <div class="presets" id="presets"></div>
      <details>
        <summary>Enter coordinates or a Google Maps link</summary>
        <input id="coordInput" type="text" inputmode="url" placeholder="36.4445, 28.2265 or maps link">
        <button id="coordBtn" class="btn wide" type="button">Use these</button>
        <p id="coordMsg" class="muted small"></p>
      </details>
      <label class="field">Name it (optional)
        <input id="baseLabel" type="text" placeholder="e.g. My hotel">
      </label>
      <button id="closeDlg" class="btn ghost wide" value="cancel">Close</button>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="pois.js"></script>
  <script src="app.js"></script>
</body>
</html>
