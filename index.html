<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rhodes Day Planner</title>
  <meta name="description" content="Plan your day on Rhodes: sights by category, distance from where you stay, walk or ride, cost and rating.">
  <meta name="theme-color" content="#0b5ea8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rhodes Day">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1 data-i18n="title">Rhodes Day Planner</h1>
      <div class="flags" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-label="English">🇬🇧</button>
        <button type="button" data-lang="et" aria-label="Eesti">🇪🇪</button>
      </div>
    </div>
    <button id="baseBtn" class="base-chip" type="button">📍 <span id="baseName">Set your stay</span> <span class="edit">✎</span></button>
  </header>

  <main>
    <!-- Explore -->
    <section id="view-explore" class="view active">
      <input id="searchInput" class="search" type="search" enterkeyhint="search" autocomplete="off" data-i18n-ph="searchPh" placeholder="Search places, or find one to add…">
      <div id="searchResults" hidden></div>
      <div class="controls" id="exploreControls">
        <div class="seg" id="rangeSeg" role="group" aria-label="Range">
          <button data-range="2" data-i18n="range2">🚶 ≤2 km</button>
          <button data-range="5">≤5 km</button>
          <button data-range="15">≤15 km</button>
          <button data-range="999" data-i18n="island">Island</button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="mustSee">
          <span data-i18n="mustSee">Also show must-sees beyond range (★4.6+)</span>
        </label>
        <div class="chips" id="catChips"></div>
        <div class="row">
          <select id="sortSel" aria-label="Sort">
            <option value="dist" data-i18n="sortDist">Sort: nearest</option>
            <option value="rating" data-i18n="sortRating">Sort: top rated</option>
            <option value="value" data-i18n="sortValue">Sort: best nearby (rating ÷ distance)</option>
          </select>
          <select id="costSel" aria-label="Cost">
            <option value="any" data-i18n="costAny">Any cost</option>
            <option value="free" data-i18n="costFree">Free only</option>
            <option value="cheap" data-i18n="costCheap">Free or under €8</option>
          </select>
        </div>
      </div>
      <p class="count" id="exploreCount"></p>
      <div id="exploreList" class="list"></div>
    </section>

    <!-- Map -->
    <section id="view-map" class="view">
      <div id="map"></div>
    </section>

    <!-- Today -->
    <section id="view-today" class="view">
      <div class="today-head">
        <h2 data-i18n="todayTitle">Today's plan</h2>
        <p class="muted" id="todaySub"></p>
        <label class="toggle">
          <input type="checkbox" id="loopChk">
          <span data-i18n="loopLabel">🔁 Finish where I started (round trip)</span>
        </label>
        <div class="row">
          <button id="suggestWalk" class="btn primary" type="button" data-i18n="suggestWalk">✨ Suggest a walking day</button>
          <button id="suggestFar" class="btn" type="button" data-i18n="suggestFar">🚗 Suggest a day trip</button>
        </div>
      </div>
      <div id="todaySummary"></div>
      <div id="todayList" class="list"></div>
    </section>

    <!-- My list -->
    <section id="view-mine" class="view">
      <div class="controls">
        <div class="seg" id="mineSeg" role="group" aria-label="Status">
          <button data-status="done" class="on" data-i18n="done">✓ Done</button>
          <button data-status="ignored" data-i18n="ignored">✕ Ignored</button>
        </div>
      </div>
      <p class="count" id="mineCount"></p>
      <div id="mineList" class="list"></div>
      <div class="danger-zone">
        <button id="resetBtn" class="btn ghost" type="button" data-i18n="reset">Reset all marks</button>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="explore" class="on"><span>🧭</span><i data-i18n="tabExplore">Explore</i></button>
    <button data-view="map"><span>🗺️</span><i data-i18n="tabMap">Map</i></button>
    <button data-view="today"><span>📅</span><i data-i18n="tabToday">Today</i><b id="todayBadge" class="badge" hidden></b></button>
    <button data-view="mine"><span>✅</span><i data-i18n="tabMine">My list</i></button>
  </nav>

  <!-- Place details + Wikipedia -->
  <dialog id="placeDialog" class="sheet">
    <div id="placeBody"></div>
  </dialog>

  <!-- First launch: pick a language -->
  <dialog id="langDialog">
    <div class="dlg lang-pick">
      <h2>Vali keel<br>Choose language</h2>
      <button type="button" class="btn wide big" data-lang="et">🇪🇪 Eesti</button>
      <button type="button" class="btn wide big" data-lang="en">🇬🇧 English</button>
    </div>
  </dialog>

  <!-- Where are you staying? -->
  <dialog id="baseDialog">
    <form method="dialog" class="dlg">
      <h2 data-i18n="dlgTitle">Where are you staying?</h2>
      <p class="muted" data-i18n="dlgSub">Distances are measured from here. Saved on this phone only.</p>
      <button id="gpsBtn" class="btn primary wide" type="button" data-i18n="gps">📍 Use my current location</button>
      <p id="gpsMsg" class="muted small"></p>
      <div class="or" data-i18n="orPick">or pick an area</div>
      <div class="presets" id="presets"></div>
      <details>
        <summary data-i18n="coordsSummary">Enter coordinates or a Google Maps link</summary>
        <input id="coordInput" type="text" inputmode="url" placeholder="36.4445, 28.2265 or maps link">
        <button id="coordBtn" class="btn wide" type="button" data-i18n="useThese">Use these</button>
        <p id="coordMsg" class="muted small"></p>
      </details>
      <label class="field"><span data-i18n="nameIt">Name it (optional)</span>
        <input id="baseLabel" type="text" placeholder="e.g. My hotel" data-i18n-ph="namePh">
      </label>
      <button id="closeDlg" class="btn ghost wide" value="cancel" data-i18n="close">Close</button>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="pois.js?v=8"></script>
  <script src="pois-et.js?v=8"></script>
  <script src="i18n.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
